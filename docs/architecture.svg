<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="470" viewBox="0 0 1040 470" role="img" aria-labelledby="title desc">
  <title id="title">accio-migrate architecture</title>
  <desc id="desc">accounts flows to resolve_account, then build_rewriter, then Rewriter (the single transformation source). Rewriter feeds two paths: copy_surface for files (rewrites names and content, skips binary, runtime and .sink-migrated) and handle_db for SQLite (destination missing: clone_and_rewrite; destination exists: merge_into). Both paths end at verify.</desc>

  <style>
    :root {
      --bg: #ffffff;
      --box: #f6f8fa;
      --stroke: #d0d7de;
      --text: #1f2328;
      --muted: #57606a;
      --line: #8c959f;
      --accent: #0969da;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117;
        --box: #161b22;
        --stroke: #30363d;
        --text: #e6edf3;
        --muted: #9198a1;
        --line: #6e7681;
        --accent: #4493f8;
      }
    }
    .bg { fill: var(--bg); }
    .box { fill: var(--box); stroke: var(--stroke); stroke-width: 1.5; }
    .head { fill: var(--accent); stroke: var(--stroke); stroke-width: 1.5; }
    .line { fill: none; stroke: var(--line); stroke-width: 1.8; stroke-linejoin: round; }
    .arrow { fill: var(--line); }
    text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 15px;
      fill: var(--text);
      text-anchor: middle;
    }
    .label { font-weight: 600; }
    .sub { font-size: 13px; fill: var(--muted); }
    .on-accent { fill: #ffffff; opacity: 0.9; }
    .bullet { font-size: 14px; text-anchor: start; fill: var(--muted); }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="arrow" d="M 0 0 L 10 5 L 0 10 Z"/>
    </marker>
  </defs>

  <rect class="bg" width="1040" height="470"/>

  <!-- top row: pipeline into the single transformation source -->
  <rect class="box" x="36"  y="40" width="120" height="64" rx="9"/>
  <rect class="box" x="196" y="40" width="176" height="64" rx="9"/>
  <rect class="box" x="412" y="40" width="180" height="64" rx="9"/>
  <rect class="head" x="632" y="40" width="300" height="64" rx="9"/>

  <text class="label" x="96"  y="73">accounts</text>
  <text class="label" x="284" y="73">resolve_account</text>
  <text class="label" x="502" y="73">build_rewriter</text>
  <text class="label" x="782" y="64">Rewriter</text>
  <text class="sub on-accent" x="782" y="86">SINGLE transformation source</text>

  <line class="line" x1="156" y1="72" x2="192" y2="72" marker-end="url(#arrow)"/>
  <line class="line" x1="372" y1="72" x2="408" y2="72" marker-end="url(#arrow)"/>
  <line class="line" x1="592" y1="72" x2="628" y2="72" marker-end="url(#arrow)"/>

  <!-- Rewriter splits into the file path and the SQLite path -->
  <path class="line" d="M 782 104 V 138 H 280 V 172" marker-end="url(#arrow)"/>
  <path class="line" d="M 782 138 H 760 V 172" marker-end="url(#arrow)"/>

  <rect class="box" x="120" y="176" width="320" height="140" rx="9"/>
  <rect class="box" x="600" y="176" width="320" height="140" rx="9"/>

  <text class="label" x="280" y="208">copy_surface (files)</text>
  <text class="bullet" x="140" y="242">• rewrite names + content</text>
  <text class="bullet" x="140" y="268">• skip binary / runtime /</text>
  <text class="bullet" x="140" y="294">  .sink-migrated</text>

  <text class="label" x="760" y="208">handle_db (SQLite)</text>
  <text class="bullet" x="620" y="242">• destination MISSING → clone_and_rewrite</text>
  <text class="bullet" x="620" y="268">• destination EXISTS → merge_into</text>
  <text class="bullet" x="620" y="294">• vec0 / FTS schema preserved</text>

  <!-- both paths converge on verification -->
  <path class="line" d="M 280 316 V 350 H 520 V 382" marker-end="url(#arrow)"/>
  <path class="line" d="M 760 316 V 350 H 520"/>

  <rect class="head" x="440" y="386" width="160" height="56" rx="9"/>
  <text class="label" x="520" y="419">verify</text>
</svg>
